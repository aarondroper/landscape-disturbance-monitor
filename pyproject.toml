[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "landscape-disturbance-monitor"
version = "0.1.0"
description = "Reproducible Sentinel-2 disturbance and spectral-recovery analysis with a static MapLibre frontend"
requires-python = ">=3.12"
dependencies = [
    "pystac-client>=0.8,<1",
    "rasterio>=1.3,<2",
    "matplotlib>=3.8,<4",
    "scipy>=1.13,<2",
    "shapely>=2,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.6,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
